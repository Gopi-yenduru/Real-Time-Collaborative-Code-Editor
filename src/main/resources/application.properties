# ---------------------------------------------------------------------------
# Real-Time Collaborative Code Editor — backend configuration
# All secrets/hosts are environment-overridable; defaults suit local dev.
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
spring.application.name=realtime-code-editor

# --- Database (MySQL) ------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:code_editor}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only
# checks that the entity model matches what the migrations produced, and never
# alters anything itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Schema migrations -----------------------------------------------------
# A database that predates Flyway is stamped at V1 (its tables already exist)
# and picks up from V2 onwards, so existing installations upgrade in place.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=pre-Flyway schema

spring.sql.init.mode=never

# --- Redis (cross-node collaboration relay) --------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- JWT -------------------------------------------------------------------
# Provide a Base64-encoded 256-bit key in production; any passphrase also works
# (it is SHA-256 hashed into a key). CHANGE THIS.
jwt.secret=${JWT_SECRET:changeme-in-production-use-a-long-random-string}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- CORS ------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- API docs & health -----------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info

# --- Logging ---------------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.codeeditor=INFO
